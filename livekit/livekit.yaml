# LiveKit Server — Production config
# Matches your current /etc/livekit.yaml on rapidvoice.pro

port: 7880

rtc:
  tcp_port: 7881
  # Must match docker-compose UDP publish and AWS security group (50000-50200)
  port_range_start: 50000
  port_range_end: 50200
  # EC2 public IP (Elastic IP). Do not use use_external_ip here — STUN needs DNS inside Docker.
  node_ip: 43.204.9.134

# Must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in your .env
keys:
  Vp9YxQ3zG7mK5nL8: r2W4tV6uY8xZ0qB2dF4gH6jK8mN0pQ2r

logging:
  level: info

# Required for server-side egress (room composite → S3)
redis:
  address: redis:6379
